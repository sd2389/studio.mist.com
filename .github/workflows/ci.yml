name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# A newer push to the same pull request cancels its older runs; runs on main always finish.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Frontend (Vitest) and backend (pytest) unit tests. The job name is a required check on main.
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Frontend tests
        run: npm test
      # Same Python as backend/Dockerfile.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - name: Install backend dependencies
        run: pip install -r backend/requirements-dev.txt
      - name: Backend tests
        working-directory: backend
        run: python -m pytest -q

  # Render goldens: the harness page captured in headless Chromium (SwiftShader) and compared
  # with tests/goldens by SSIM. See tests/goldens/README.md before regenerating them.
  golden:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Build app (harness enabled)
        run: NEXT_PUBLIC_ENABLE_RENDER_HARNESS=1 npm run build
      - name: Start app
        run: |
          npm run start &
          for i in $(seq 1 60); do
            curl -sf http://localhost:3000/render-harness?lighting=studio > /dev/null && break
            sleep 2
          done
          curl -sf "http://localhost:3000/render-harness?lighting=studio" > /dev/null || { echo "server never came up"; exit 1; }
      - run: npm run test:golden
      - name: Upload captures on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: golden-failures
          path: /tmp/golden-*
          retention-days: 7
