name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx vitest run

  golden:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Build app (harness enabled)
        run: NEXT_PUBLIC_ENABLE_RENDER_HARNESS=1 npm run build
      - name: Start app
        run: |
          npm run start &
          for i in $(seq 1 60); do
            curl -sf http://localhost:3000/render-harness?lighting=studio > /dev/null && break
            sleep 2
          done
          curl -sf "http://localhost:3000/render-harness?lighting=studio" > /dev/null || { echo "server never came up"; exit 1; }
      - run: npm run test:golden
      - name: Upload diffs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: golden-failures
          path: /tmp/golden-*
